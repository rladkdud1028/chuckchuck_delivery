<style>
:root{--navy:#33415c;--mint:#ccefe5;--mint2:#eaf8f3;--yellow:#ffe7a6;--pink:#ffe0e5;--blue:#dcecff;--paper:#fffdf8;--line:#e8e5dc;--shadow:0 8px 24px #33415c12}
*{box-sizing:border-box}body{margin:0;background:#fffaf1;color:var(--navy);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;border-radius:16px;padding:12px 16px;font-weight:800;color:var(--navy);background:var(--mint)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#5eb99f;color:white}.soft{background:#f0f1ee}.danger{background:#ffe0e5;color:#a43c52}.small{padding:8px 11px;border-radius:12px;font-size:14px}.wrap{max-width:1120px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:clamp(22px,4vw,34px);font-weight:950;letter-spacing:-1.5px}.sub{font-size:14px;color:#718096}.panel,.card{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.panel{padding:22px}.hero{background:linear-gradient(135deg,#e7f8f1,#fff0cf);padding:30px;border-radius:28px;display:flex;align-items:center;gap:24px;margin:20px 0}.hero img{width:min(35%,300px);border-radius:22px;object-fit:contain}.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px;line-height:1.2}.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mode{padding:28px 16px;text-align:center;min-height:170px;font-size:20px;border-radius:24px}.mode span{display:block;font-size:42px;margin-bottom:10px}.mode:nth-child(2){background:var(--yellow)}.mode:nth-child(3){background:var(--pink)}h2{margin:0 0 16px;font-size:24px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.bar button.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.product{padding:12px;text-align:left;border:1px solid var(--line);border-radius:20px;background:white;box-shadow:var(--shadow)}.photo{height:112px;border-radius:15px;background:#f5f7f3;display:grid;place-items:center;font-size:56px;overflow:hidden;margin-bottom:10px}.photo img{width:100%;height:100%;object-fit:cover}.pname{font-weight:900;font-size:17px}.price{font-weight:800;color:#579b88;margin:5px 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid #dcded8;border-radius:13px;padding:12px;background:#fff}.field textarea{min-height:76px;resize:vertical}.hint{font-size:13px;color:#82909d}.list{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--mint2);font-size:12px;font-weight:900}.tag.yellow{background:#fff4d5}.tag.pink{background:#ffe9ed}.empty{text-align:center;padding:35px;color:#87919c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f0f1ee}.tabs button.active{background:var(--navy);color:white}.hidden{display:none!important}.split{display:grid;grid-template-columns:1fr 330px;gap:18px}.cartline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.notice{padding:12px 15px;background:#fff4d5;border-radius:14px;font-size:14px;margin:12px 0}.modalbg{position:fixed;inset:0;background:#17203388;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;padding:22px;border-radius:24px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.receipt{border:2px dashed #b7c8c0;padding:18px;border-radius:18px;background:#fff}.receipt h3{text-align:center;margin-top:0}.muted{color:#7d8996}.adminrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.adminrow .photo{height:56px;width:64px;margin:0;font-size:30px}.foot{text-align:center;color:#8a929b;font-size:12px;padding:30px}
@media(max-width:720px){.wrap{padding:14px}.hero{padding:18px}.hero img{width:30%}.modegrid{grid-template-columns:1fr}.mode{min-height:100px;display:flex;align-items:center;justify-content:center;gap:16px}.mode span{margin:0}.split{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}.top{align-items:flex-start;flex-direction:column}}
@media print{body{background:white}.no-print{display:none!important}.wrap{max-width:none;padding:0}.panel,.order{box-shadow:none}}

<body><div class="wrap">
<header class="top"><div><div class="brand">🚚 척척! 무엇이든 전해드려요</div><div class="sub">한빛반 주문·배달 놀이 앱</div></div><button class="soft no-print" onclick="home()">처음 화면</button></header>
<main id="app"></main><div class="foot">한빛반 주문·배달 놀이 앱 · 실제 결제 기능이 없는 놀이용 도구</div></div>
<div id="modalroot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://aazrxhyrkrmbwktreobs.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_exgJNYEle19jVw88oA0yuQ_SGALwNSl";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const STORAGE_BUCKET="hanbit-product-images";
const MIGRATION_KEY="hanbit_delivery_cloud_migrated_v1";
const seed=[
['음식점','김밥',2000,'🍙'],['음식점','커피',1500,'☕'],['음식점','음료수',1000,'🧃'],['음식점','케이크',2500,'🍰'],['음식점','주먹밥',1500,'🍘'],['음식점','식빵',1000,'🍞'],['음식점','롤케이크',2000,'🍥'],
['장난감 가게','키링 인형 (랜덤 배송)',2000,'🧸'],['장난감 가게','자동차',1500,'🚗'],['장난감 가게','레고 블록',2500,'🧱'],['장난감 가게','벽돌 블록',2000,'🧱'],['장난감 가게','나무 블록',2000,'🪵'],['장난감 가게','동화책',2500,'📚'],['장난감 가게','팝잇',1500,'🫧'],['장난감 가게','벌집피젯',1500,'🐝'],
['생활용품점','컵',1000,'🥤'],['생활용품점','접시',1000,'🍽️'],['생활용품점','숟가락',500,'🥄'],['생활용품점','모자',2000,'🧢'],['생활용품점','미용놀잇감',2500,'💇'],['생활용품점','병원놀잇감',2500,'🩺']];
const KEY='hanbit_delivery_v1';
const defaultData={products:seed.map((x,i)=>({id:'p'+i,shop:x[0],name:x[1],price:x[2],emoji:x[3],image:''})),orders:[],closed:false,sound:true,pinSet:false,pin:''};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData);
let cart=[],shop='전체',mode='home',adminTab='상품 관리',filter='전체';
let cloudReady=false,cloudBusy=false,pollTimer=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function showCloudError(error,context){console.error(context,error);alert(context+'\n'+(error?.message||String(error))+'\nSupabase SQL 설정이 완료되었는지 확인해주세요.')}
function productToRow(p){return {id:String(p.id),shop:p.shop,name:p.name,price:Number(p.price),emoji:p.emoji||'📦',image:p.image||''}}
function rowToProduct(p){return {id:String(p.id),shop:p.shop,name:p.name,price:Number(p.price),emoji:p.emoji||'📦',image:p.image||''}}
function sortProducts(list){return list.sort((a,b)=>{const ma=/^p(\d+)$/.exec(a.id),mb=/^p(\d+)$/.exec(b.id);if(ma&&mb)return Number(ma[1])-Number(mb[1]);if(ma)return -1;if(mb)return 1;return String(a.id).localeCompare(String(b.id));})}
function orderToRow(o){return {buyer:o.buyer,dest:o.dest||'',memo:o.memo||'',items:o.items||[],total:Number(o.total||0),time:o.time||'',date:o.date||'',status:o.status||'주문 접수'}}
function rowToOrder(o){return {id:Number(o.id),no:String(o.id).padStart(3,'0'),buyer:o.buyer,dest:o.dest||'',memo:o.memo||'',items:o.items||[],total:Number(o.total||0),time:o.time||'',date:o.date||'',status:o.status||'주문 접수'}}
async function uploadProductImage(image,productId){
 if(!image||!image.startsWith('data:')) return image||'';
 const blob=await (await fetch(image)).blob();
 const path=String(productId)+'/'+Date.now()+'.jpg';
 const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:true});
 if(error) throw error;
 return supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function bootstrapCloud(){
 try{
  const legacy=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData);
  const [pr,orr,sr]=await Promise.all([
   supabaseClient.from('products').select('*').order('id'),
   supabaseClient.from('orders').select('*').order('id',{ascending:false}),
   supabaseClient.from('app_settings').select('*').eq('id',1).maybeSingle()
  ]);
  if(pr.error) throw pr.error; if(orr.error) throw orr.error; if(sr.error) throw sr.error;
  if(!pr.data.length){
   const initial=(legacy.products?.length?legacy.products:defaultData.products).map(productToRow);
   for(const item of initial){ if(item.image?.startsWith('data:')) item.image=await uploadProductImage(item.image,item.id); }
   const {error}=await supabaseClient.from('products').upsert(initial); if(error) throw error;
  }
  if(!orr.data.length && legacy.orders?.length && localStorage.getItem(MIGRATION_KEY)!=='done'){
   localStorage.setItem(MIGRATION_KEY,'pending');
   const oldOrders=[...legacy.orders].reverse().map(orderToRow);
   const {error}=await supabaseClient.from('orders').insert(oldOrders); if(error) throw error;
   localStorage.setItem(MIGRATION_KEY,'done');
  } else if(localStorage.getItem(MIGRATION_KEY)!=='done') localStorage.setItem(MIGRATION_KEY,'done');
  if(!sr.data){const {error}=await supabaseClient.from('app_settings').upsert({id:1,closed:!!legacy.closed,sound:legacy.sound!==false});if(error)throw error;}
  await refreshCloud(false);
  cloudReady=true;
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>refreshCloud(true),5000);
 }catch(error){showCloudError(error,'클라우드 데이터 연결에 실패했어요.');}
}
async function refreshCloud(shouldRender=true){
 if(cloudBusy)return; cloudBusy=true;
 try{
  const [pr,orr,sr]=await Promise.all([
   supabaseClient.from('products').select('*').order('id'),
   supabaseClient.from('orders').select('*').order('id',{ascending:false}),
   supabaseClient.from('app_settings').select('*').eq('id',1).maybeSingle()
  ]);
  if(pr.error)throw pr.error;if(orr.error)throw orr.error;if(sr.error)throw sr.error;
  data.products=sortProducts((pr.data||[]).map(rowToProduct));
  data.orders=(orr.data||[]).map(rowToOrder);
  if(sr.data){data.closed=!!sr.data.closed;data.sound=sr.data.sound!==false;}
  save();
  if(shouldRender && mode!=='order')render();
 }catch(error){console.error('클라우드 새로고침 실패',error);}
 finally{cloudBusy=false;}
}
async function saveSettings(){if(!cloudReady)return;const {error}=await supabaseClient.from('app_settings').upsert({id:1,closed:!!data.closed,sound:!!data.sound});if(error)showCloudError(error,'환경 설정을 저장하지 못했어요.');}
async function toggleSetting(key){data[key]=!data[key];save();await saveSettings();render();}
function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){mode='home';render()}
function render(){let a=document.getElementById('app');if(mode==='home')a.innerHTML=`
<section class="hero"><img src="start-image.png" alt="척척! 무엇이든 전해드려요 대표 그림" onerror="this.style.display='none'"><div><h1>척척! 무엇이든<br>전해드려요!</h1><p>한빛반 친구들과 함께하는 주문·배달 놀이</p></div></section>
<div class="modegrid"><button class="mode" onclick="mode='order';render()"><span>🛍️</span>주문하기</button><button class="mode" onclick="mode='delivery';render()"><span>🛵</span>배달하기</button><button class="mode" onclick="adminLogin()"><span>⚙️</span>관리자</button></div>
<div class="notice">📌 주문자와 배달 담당자는 별도 로그인 없이 이용해요. 관리자 메뉴는 비밀번호가 필요해요.</div>`;
if(mode==='order')orderPage(a);if(mode==='delivery')deliveryPage(a);if(mode==='admin')adminPage(a)}
function productCard(p){return `<div class="product"><div class="photo">${p.image?`<img src="${p.image}">`:p.emoji||'📦'}</div><div class="pname">${esc(p.name)}</div><div class="price">${money(p.price)}</div><button class="primary" style="width:100%" onclick="addCart('${p.id}')" ${data.closed?'disabled':''}>장바구니 담기</button></div>`}
function orderPage(a){let shops=['전체','음식점','장난감 가게','생활용품점'];a.innerHTML=`<div class="panel"><div class="row"><h2>🛍️ 무엇을 배달해 드릴까요?</h2><span class="tag ${data.closed?'pink':''}">${data.closed?'주문 마감':'주문 가능'}</span></div>${data.closed?'<div class="notice">지금은 주문을 받고 있지 않아요.</div>':''}<div class="tabs">${shops.map(s=>`<button class="${shop===s?'active':''}" onclick="shop='${s}';render()">${s}</button>`).join('')}</div><div class="split"><section class="grid">${data.products.filter(p=>shop==='전체'||p.shop===shop).map(productCard).join('')||'<div class="empty">등록된 상품이 없어요.</div>'}</section><aside class="panel"><h2>🧺 장바구니</h2>${cart.length?cart.map(id=>{let p=data.products.find(x=>x.id===id);return p?`<div class="cartline"><span>${esc(p.name)}</span><b>${money(p.price)}</b></div>`:''}).join(''):'<div class="empty">상품을 담아주세요.</div>'}<div class="row" style="margin:16px 0"><b>총 주문 금액</b><b>${money(cart.reduce((s,id)=>s+(data.products.find(p=>p.id===id)?.price||0),0))}</b></div><div class="field"><label>주문자 이름 *</label><input id="buyer" placeholder="예) 김○○ 선생님, 김○○"></div><div class="field"><label>배송지</label><input id="dest" placeholder="예) 햇살반, 교무실, 유희실, 1층 강당"></div><div class="field"><label>요청 사항</label><textarea id="memo" placeholder="예) 문 앞에 놓고 노크해주세요. 안전하게 오세요!"></textarea></div><button class="primary" style="width:100%" onclick="placeOrder()" ${data.closed?'disabled':''}>주문하기</button></aside></div></div>`}
function addCart(id){if(data.closed)return;if(cart.includes(id)){alert('이미 장바구니에 담긴 상품이에요!');return}cart.push(id);render()}
function beep(){if(!data.sound)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.setValueAtTime(1175,c.currentTime+.13);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.36)}catch(e){}}
async function placeOrder(){if(data.closed){alert('지금은 주문이 마감되었어요.');render();return}let buyer=document.getElementById('buyer').value.trim(),dest=document.getElementById('dest').value.trim(),memo=document.getElementById('memo').value.trim();if(!buyer||!cart.length){alert('주문자 이름과 상품을 확인해주세요.');return}if(!cloudReady){alert('공유 데이터 연결이 아직 완료되지 않았어요. 잠시 후 다시 시도해주세요.');return}let items=cart.map(id=>data.products.find(p=>p.id===id)).filter(Boolean).map(p=>({name:p.name,price:p.price,emoji:p.emoji,image:p.image}));let draft={buyer,dest,memo,items,total:items.reduce((s,p)=>s+p.price,0),time:new Date().toLocaleString('ko-KR'),date:new Date().toLocaleDateString('ko-KR'),status:'주문 접수'};const {data:created,error}=await supabaseClient.from('orders').insert(orderToRow(draft)).select('*').single();if(error){showCloudError(error,'주문을 저장하지 못했어요.');return}let order=rowToOrder(created);data.orders.unshift(order);save();cart=[];beep();receipt(order)}
function receipt(o){document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><div class="receipt" id="receipt"><h3>🎉 주문이 접수되었어요!</h3><p style="text-align:center;font-size:28px;font-weight:900">주문번호 ${o.no}</p><p>주문자: ${esc(o.buyer)}<br>배송지: ${esc(o.dest||'미입력')}<br>주문 시간: ${esc(o.time)}</p><hr>${o.items.map(p=>`<div class="cartline"><span>${p.image?`<img src="${p.image}" style="width:36px;height:36px;object-fit:cover;vertical-align:middle">`:p.emoji} ${esc(p.name)}</span><b>${money(p.price)}</b></div>`).join('')}<p>요청 사항: ${esc(o.memo||'없음')}</p><h3>총 ${money(o.total)}</h3></div><div class="actions no-print"><button onclick="window.print()">인쇄하기</button><button onclick="saveReceipt(${o.id})">이미지 저장</button><button class="primary" onclick="document.getElementById('modalroot').innerHTML='';home()">닫기</button></div></div></div>`}
function saveReceipt(id){let o=data.orders.find(x=>x.id===id);let c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=900;c.height=620;ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#b7c8c0';ctx.lineWidth=5;ctx.setLineDash([12,8]);ctx.strokeRect(24,24,852,572);ctx.setLineDash([]);ctx.fillStyle='#33415c';ctx.textAlign='center';ctx.font='bold 42px sans-serif';ctx.fillText('척척! 무엇이든 전해드려요',450,95);ctx.font='bold 34px sans-serif';ctx.fillText('주문번호 '+o.no,450,155);ctx.textAlign='left';ctx.font='26px sans-serif';let lines=['주문자: '+o.buyer,'배송지: '+(o.dest||'미입력'),'주문 시간: '+o.time,'상품: '+o.items.map(p=>p.name).join(', '),'요청 사항: '+(o.memo||'없음'),'총 주문 금액: '+money(o.total)];lines.forEach((t,i)=>ctx.fillText(t,75,230+i*55));let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='주문서_'+o.no+'.png';a.click()}
function deliveryPage(a){let active=data.orders.filter(o=>o.status!=='배달 완료'),done=data.orders.filter(o=>o.status==='배달 완료');a.innerHTML=`<div class="panel"><div class="row"><h2>🛵 배달 현황</h2><button class="soft small" onclick="render()">새로고침</button></div><div class="tabs">${['진행 중인 주문','배달 완료'].map((x,i)=>`<button class="${filter===(i?'완료':'전체')?'active':''}" onclick="filter='${i?'완료':'전체'}';render()">${x} (${i?done.length:active.length})</button>`).join('')}</div><div class="list">${(filter==='완료'?done:active).map(o=>orderCard(o,true)).join('')||'<div class="empty">아직 주문이 없어요.</div>'}</div></div>`}
function orderCard(o,buttons){return `<div class="order"><div class="row"><b>주문번호 ${o.no} · ${esc(o.buyer)}</b><span class="tag ${o.status==='배달 완료'?'':'yellow'}">${o.status}</span></div><p class="muted">${esc(o.dest||'배송지 미입력')} · ${esc(o.time)}</p><div>${o.items.map(p=>`<span style="display:inline-block;margin:4px 8px 4px 0">${p.image?`<img src="${p.image}" style="width:30px;height:30px;object-fit:cover;vertical-align:middle">`:p.emoji} ${esc(p.name)}</span>`).join('')}</div><p>요청 사항: ${esc(o.memo||'없음')}<br><b>총 ${money(o.total)}</b></p><div class="actions"><button class="small" onclick="showOrder(${o.id})">주문서 크게 보기</button>${buttons&&o.status!=='배달 완료'?`<button class="primary small" onclick="nextStatus(${o.id})">${o.status==='주문 접수'?'상품 준비 시작':'배달 완료 처리'}</button>`:''}</div></div>`}
function showOrder(id){let o=data.orders.find(x=>x.id===id);document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><div class="receipt"><h3>🧾 배달 주문서</h3><h2 style="text-align:center">#${o.no}</h2><p><b>주문자:</b> ${esc(o.buyer)}<br><b>배송지:</b> ${esc(o.dest||'미입력')}<br><b>주문 시간:</b> ${esc(o.time)}</p>${o.items.map(p=>`<div class="cartline"><span>${p.image?`<img src="${p.image}" style="width:55px;height:55px;object-fit:cover;vertical-align:middle">`:p.emoji} ${esc(p.name)}</span><b>${money(p.price)}</b></div>`).join('')}<p><b>요청 사항:</b> ${esc(o.memo||'없음')}</p><h3>총 ${money(o.total)}</h3><p class="tag">${o.status}</p></div><div class="actions no-print"><button onclick="window.print()">인쇄하기</button><button class="primary" onclick="document.getElementById('modalroot').innerHTML=''">닫기</button></div></div></div>`}
async function nextStatus(id){let o=data.orders.find(x=>x.id===id);if(!o)return;let status=o.status==='주문 접수'?'상품 준비 중':o.status==='상품 준비 중'?'배달 중':'배달 완료';const {error}=await supabaseClient.from('orders').update({status}).eq('id',id);if(error){showCloudError(error,'배달 상태를 변경하지 못했어요.');return}await refreshCloud(true)}
function adminLogin(){if(!data.pinSet){document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><h2>관리자 비밀번호 만들기</h2><p class="muted">처음 한 번 관리자 비밀번호를 설정해주세요.</p><input id="newpin" type="password" class="field" placeholder="비밀번호"><div class="actions"><button class="primary" onclick="setPin()">설정하고 들어가기</button><button onclick="document.getElementById('modalroot').innerHTML=''">취소</button></div></div></div>`}else{document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><h2>관리자 로그인</h2><input id="pin" type="password" class="field" placeholder="관리자 비밀번호"><div class="actions"><button class="primary" onclick="checkPin()">로그인</button><button onclick="document.getElementById('modalroot').innerHTML=''">취소</button></div></div></div>`}}
function setPin(){let p=document.getElementById('newpin').value;if(p.length<4){alert('4자리 이상 입력해주세요.');return}data.pin=p;data.pinSet=true;save();document.getElementById('modalroot').innerHTML='';mode='admin';render()}
function checkPin(){if(document.getElementById('pin').value===data.pin){document.getElementById('modalroot').innerHTML='';mode='admin';render()}else alert('비밀번호가 맞지 않아요.')}
function adminPage(a){a.innerHTML=`<div class="panel"><div class="row"><h2>⚙️ 관리자</h2><button class="soft small" onclick="home()">로그아웃</button></div><div class="tabs">${['상품 관리','주문 관리','환경 설정'].map(t=>`<button class="${adminTab===t?'active':''}" onclick="adminTab='${t}';render()">${t}</button>`).join('')}</div>${adminTab==='상품 관리'?productAdmin():adminTab==='주문 관리'?ordersAdmin():settingsAdmin()}</div>`}
function productAdmin(){return `<div class="row"><h2>상품 목록 (${data.products.length})</h2><button class="primary" onclick="editProduct()">＋ 상품 추가</button></div>${data.products.map(p=>`<div class="adminrow"><div class="photo">${p.image?`<img src="${p.image}">`:p.emoji}</div><div><b>${esc(p.name)}</b><div class="muted">${p.shop} · ${money(p.price)}</div></div><div><button class="small" onclick="editProduct('${p.id}')">수정</button> <button class="danger small" onclick="deleteProduct('${p.id}')">삭제</button></div></div>`).join('')}`}
function editProduct(id){let p=data.products.find(x=>x.id===id)||{id:'p'+Date.now(),shop:'음식점',name:'',price:1000,emoji:'📦',image:''};document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><h2>${id?'상품 수정':'상품 추가'}</h2><div class="field"><label>가게</label><select id="pshop">${['음식점','장난감 가게','생활용품점'].map(s=>`<option ${p.shop===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>상품 이름</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>가격(원)</label><input id="pprice" type="number" min="0" value="${p.price}"></div><div class="field"><label>기본 그림 이모지(선택)</label><input id="pemoji" value="${p.emoji||'📦'}"></div><div class="field"><label>실제 사진 업로드</label><input id="pimage" type="file" accept="image/*" onchange="previewImage(this)"><div id="preview" class="photo">${p.image?`<img src="${p.image}">`:p.emoji}</div><div class="hint">사진은 공유 저장소에 저장되어 다른 기기에서도 볼 수 있어요. 큰 사진은 자동 축소합니다.</div></div><div class="actions"><button class="primary" onclick="saveProduct('${id||''}')">저장</button><button onclick="document.getElementById('modalroot').innerHTML=''">취소</button></div></div></div>`;window.editingImage=p.image||''}
function previewImage(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window.editingImage=c.toDataURL('image/jpeg',.75);document.getElementById('preview').innerHTML=`<img src="${window.editingImage}">`};im.src=e.target.result};r.readAsDataURL(f)}
async function saveProduct(id){let p=data.products.find(x=>x.id===id);let obj={id:id||'p'+Date.now(),shop:document.getElementById('pshop').value,name:document.getElementById('pname').value.trim(),price:Number(document.getElementById('pprice').value),emoji:document.getElementById('pemoji').value||'📦',image:window.editingImage||''};if(!obj.name||obj.price<0){alert('상품명과 가격을 확인해주세요.');return}try{obj.image=await uploadProductImage(obj.image,obj.id);const {error}=await supabaseClient.from('products').upsert(productToRow(obj));if(error)throw error;if(p)Object.assign(p,obj);else data.products.push(obj);save();document.getElementById('modalroot').innerHTML='';render()}catch(error){showCloudError(error,'상품을 저장하지 못했어요.')}}
async function deleteProduct(id){if(confirm('이 상품을 삭제할까요?')){const {error}=await supabaseClient.from('products').delete().eq('id',String(id));if(error){showCloudError(error,'상품을 삭제하지 못했어요.');return}data.products=data.products.filter(p=>p.id!==id);save();render()}}
function ordersAdmin(){return `<div class="bar"><button class="${filter==='전체'?'active':''}" onclick="filter='전체';render()">전체</button><button class="${filter==='진행'?'active':''}" onclick="filter='진행';render()">진행 중</button><button class="${filter==='완료'?'active':''}" onclick="filter='완료';render()">배달 완료</button></div><div class="list">${data.orders.filter(o=>filter==='전체'||(filter==='완료'?o.status==='배달 완료':o.status!=='배달 완료')).map(o=>orderCard(o,false)+`<div style="text-align:right;margin-top:-5px"><button class="danger small" onclick="deleteOrder(${o.id})">주문 삭제</button></div>`).join('')||'<div class="empty">주문 내역이 없어요.</div>'}</div><div class="actions"><button class="danger" onclick="clearOrders()">전체 주문 내역 삭제</button></div>`}
async function deleteOrder(id){if(confirm('이 주문을 삭제할까요?')){const {error}=await supabaseClient.from('orders').delete().eq('id',id);if(error){showCloudError(error,'주문을 삭제하지 못했어요.');return}data.orders=data.orders.filter(o=>o.id!==id);save();render()}}
async function clearOrders(){if(confirm('모든 날짜의 주문 내역을 삭제할까요? 이 작업은 되돌릴 수 없어요.')){const {error}=await supabaseClient.from('orders').delete().not('id','is',null);if(error){showCloudError(error,'전체 주문 내역을 삭제하지 못했어요.');return}data.orders=[];save();render()}}
function settingsAdmin(){return `<div class="order"><h3>주문 접수</h3><p>${data.closed?'현재 주문 마감 상태입니다.':'현재 주문을 받고 있습니다.'}</p><button class="${data.closed?'primary':'danger'}" onclick="toggleSetting('closed')">${data.closed?'주문 재개':'주문 마감'}</button></div><div class="order" style="margin-top:12px"><h3>신규 주문 알림음</h3><p>현재 ${data.sound?'켜짐':'꺼짐'}</p><button onclick="toggleSetting('sound')">${data.sound?'알림음 끄기':'알림음 켜기'}</button><button class="soft" onclick="beep()">소리 미리 듣기</button></div><div class="order" style="margin-top:12px"><h3>데이터 백업</h3><p class="muted">이 브라우저의 상품·주문 데이터를 파일로 저장하거나 복원할 수 있어요.</p><button onclick="backup()">백업 파일 다운로드</button><input type="file" accept="application/json" onchange="restore(this)" style="margin-top:10px"></div>`}
function backup(){let b=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hanbit-delivery-backup.json';a.click();URL.revokeObjectURL(u)}
async function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.orders)throw 0;for(const p of x.products){p.image=await uploadProductImage(p.image,p.id)}const {error:pe}=await supabaseClient.from('products').upsert(x.products.map(productToRow));if(pe)throw pe;const {error:oe}=await supabaseClient.from('orders').delete().not('id','is',null);if(oe)throw oe;for(const o of [...x.orders].reverse()){const {error}=await supabaseClient.from('orders').insert(orderToRow(o));if(error)throw error}data.closed=!!x.closed;data.sound=x.sound!==false;await saveSettings();await refreshCloud(true);alert('복원했어요.')}catch(e){showCloudError(e,'백업 파일을 복원하지 못했어요.')}};r.readAsText(f)}
document.getElementById('app').innerHTML='<div class="empty">공유 데이터를 불러오는 중이에요...</div>';
bootstrapCloud();
</script></body></html>
